name: Release attestations

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or ref to attest
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    name: Build and attest release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        run: npm run build

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
